name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        timeout: 90s
        script: |
          if ! command -v git &> /dev/null; then
            sudo yum install git -y
          fi
          if ! command -v docker &> /dev/null; then
            sudo yum install docker -y
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ec2-user
          fi
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            sudo ln -sf /usr/local/bin/docker-compose /usr/bin/docker-compose
          fi

          if [ ! -d "flowerforall" ]; then
            git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/dokuzsertkol/FlowerForAll.git flowerforall
          fi
          cd flowerforall
          git pull

          cat <<EOF > .env
          MONGO_URI=${{ secrets.MONGO_URI }}
          VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
          AWS_FRONTEND_URL=${{ secrets.AWS_FRONTEND_URL }}
          EOF

          echo "Deploying containers with secrets..."
          docker-compose down || true
          docker-compose build
          docker-compose up -d
